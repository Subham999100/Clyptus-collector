[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clyptus-collector"
version = "0.1.0"
description = "Standalone collector of publicly available job postings for the Clyptus Job Portal."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "scrapy>=2.11,<3",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "typer>=0.12,<1",
    "structlog>=24.1,<26",
    "openpyxl>=3.1,<4",
    "dateparser>=1.2,<2",
    "tldextract>=5.4,<6",
    "extruct>=0.17,<1",
    "selectolax>=0.3,<1",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.5,<1",
]

[project.scripts]
collector = "collector.cli:app"

[tool.setuptools.packages.find]
include = ["collector*"]

[tool.setuptools.package-data]
"collector.companies" = ["*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Project-local temp dir (recreated on each run) instead of the system temp directory.
addopts = "--basetemp=.pytest_tmp"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".pytest_tmp"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
